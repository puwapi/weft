name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NativeAOT cannot cross-compile between OPERATING SYSTEMS, so there is
          # one runner per OS. It does cross ARCHITECTURES within one: an arm64
          # Mac produces a working x86_64 binary, verified by running it. That is
          # worth knowing, because macos-13 is a scarce runner and waiting for one
          # held up an entire release for no reason.
          - { os: macos-latest,     rid: osx-arm64,   name: weft-macos-arm64 }
          - { os: macos-latest,     rid: osx-x64,     name: weft-macos-x64 }
          - { os: ubuntu-latest,    rid: linux-x64,   name: weft-linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, name: weft-linux-arm64 }
          - { os: windows-latest,   rid: win-x64,     name: weft-windows-x64 }
          # Still a public preview, and not enabled on every account. Allowed to
          # fail so a missing runner costs one architecture rather than the whole
          # release.
          - { os: windows-11-arm,   rid: win-arm64,   name: weft-windows-arm64, optional: true }

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/Weft.Cli -c Release -r ${{ matrix.rid }} -o ./out

      - name: Name it and check it runs
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./out/weft.exe --version
            cp out/weft.exe "dist/${{ matrix.name }}.exe"
          else
            ./out/weft --version
            cp out/weft "dist/${{ matrix.name }}"
            chmod +x "dist/${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The server as an image, so running one is a single command rather than a
  # clone and a build. Multi-arch because the machine people put it on is as
  # likely to be arm as x64 now.
  #
  # The arm64 half is built under QEMU and is SLOW: emulating a .NET publish costs
  # tens of minutes, and it is why this job outlives the six binaries beside it.
  # Building each architecture on its own runner and merging a manifest would fix
  # that; it is more workflow than it is worth until someone is waiting on it.
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Weft.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A container package is created PRIVATE even when its repository is public,
      # and nothing says so: the push succeeds, the tags appear, and the docker run
      # in the README fails for everyone but the person who published it. GitHub
      # offers no API to change it, so this cannot be fixed here; it can be
      # reported, which is the difference between a broken instruction someone
      # discovers and one we already know about.
      #
      # Reported rather than fatal: the binaries beside it are fine, and failing
      # the release over a switch nobody can flip from here helps no one.
      - name: Can a stranger pull it?
        continue-on-error: true
        run: |
          docker logout ghcr.io
          if docker pull "ghcr.io/${{ github.repository }}-server:latest"; then
            echo "::notice::the published image is anonymously pullable"
          else
            echo "::warning::ghcr.io/${{ github.repository }}-server is not public. \
          The docker run in the README will fail for everyone else. Flip it once at \
          https://github.com/orgs/${{ github.repository_owner }}/packages/container/\
          $(basename ${{ github.repository }})-server/settings"
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Published beside the binaries so an installer can verify what it fetched.
      # Without them, "curl | sh" is a promise that nothing went wrong in transit.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
